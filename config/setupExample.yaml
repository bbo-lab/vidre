# Idea: Node daemons have to be started and be able to listen to incoming
# commands generated by parsing this file. Instances of modules/plugins 
# are defined at first with relevant data. Then pipes are defined connecting
# outputs of modules to inputs.
#
# Example data flow:
# 
#  cam1 -> storage1
#    |
#    L-> netSink1 --(network)--> netSource1 -> presentation
#
#  cam2 -> storage2
#
---
camOverview:
  type: camera
  vendor: pylon   # Can this be acquired from e.g. the specific usb port itself? 
  serial: 22343925
  config_file: C:/Projects/vidre/defaultConfig.config
  is_config_local: true # Determines if the config file is local on the node or if it should be sent over on setup.
  description: For monitoring.
camHeadset:
  type: camera
  vendor: dummy
  serial: 10001010
  config_file: C:/Projects/vidre/defaultConfig.config
  is_config_local: true
  description: For saving and further analysis afterwards.
camLeftCorner:
  type: camera
  vendor: iAmNotSupported
  serial: 10203000
  config_file: C:/Projects/vidre/defaultConfig.config
  is_config_local: true
  description: For saving and further analysis afterwards.


# ---- UNIMPLEMENTED ----

storage1:
  type: storage
  output_file: ../out/cam1.mp4
storage2:
  type: storage
  output_file: ../out/cam2.mp4

netSink1:
  type: netSink
  ip: 127.000.000 # Or MAC address. Or having a sort of LAN DNS, i.e. named IPs to change out nodes without having to change config file IP/MAC.
  port: 25565
netSource1:
  type: netSource
  ip: 127.000.001
  port: 25565

presentation:
  type: imageMonitor

pipes:
# - output: input
  - camHeadset: storage1
  - camOverview: storage2
  - camHeadset: netSink
  - netSource: presentation